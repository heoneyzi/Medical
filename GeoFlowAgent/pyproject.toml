[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geoflowagent"
version = "0.1.0"
description = "Frozen multi-view genomics embeddings and whole-plan flow matching for closed-loop tool agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "GeoFlowAgent contributors"}]
dependencies = [
  "jsonschema>=4.23",
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
  "torch>=2.2,<3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
hf = [
  "accelerate>=0.33",
  "datasets>=2.20,<5",
  "einops>=0.6,<1",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "transformers>=4.45,<5",
]
eval = [
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
geoflow = "geoflowagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoflowagent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
