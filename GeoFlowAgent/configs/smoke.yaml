seed: 17
device: cpu
project_root: ..

paths:
  raw_dir: data/raw/smoke
  processed_dir: artifacts/smoke/processed
  cache_dir: artifacts/smoke/cache
  embedding_report_dir: artifacts/smoke/reports/embeddings
  metric_output_dir: artifacts/smoke/checkpoints/metric
  flow_output_dir: artifacts/smoke/checkpoints/flow
  agent_report_dir: artifacts/smoke/reports/agent
  run_summary: artifacts/smoke/run_summary.json

preprocessing:
  max_search_depth: 12
  require_optimal_demo: true
  counterfactual_policy: symbolic

embedding:
  batch_size: 64
  storage_dtype: float32
  views:
    general:
      kind: prototype
      query_encoder:
        backend: hash
        dim: 96
        salt: smoke-general-v1
        min_ngram: 1
        max_ngram: 2
      document_encoder:
        backend: hash
        dim: 96
        salt: smoke-general-v1
        min_ngram: 1
        max_ngram: 2
      example_fields: [query, goal, state, history]
      tool_fields: [description, contract]
      encode_background: true
    biomedical:
      kind: prototype
      query_encoder:
        backend: hash
        dim: 96
        salt: smoke-biomedical-v1
        min_ngram: 1
        max_ngram: 3
      document_encoder:
        backend: hash
        dim: 96
        salt: smoke-biomedical-v1
        min_ngram: 1
        max_ngram: 3
      example_fields: [query, goal, state, history]
      tool_fields: [description, contract]
      encode_background: true
    sequence_aux:
      kind: state_only
      encode_pairs: false
      snapshot_field: sequence
      query_encoder:
        backend: hash
        dim: 64
        salt: smoke-dna-v1
        min_ngram: 1
        max_ngram: 1
      example_fields: [sequence]
      tool_fields: []
      encode_background: false

metric_training:
  structured_dim: 48
  shared_dim: 32
  hidden_dim: 64
  distance: cosine
  distance_rank: 16
  temperature: 0.2
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  epochs: 40
  patience: 10
  regret_weight: 0.5
  transition_weight: 0.2
  rank_margin: 0.1
  apply_contract_mask: false

flow_training:
  max_plan_length: 10
  hidden_dim: 64
  layers: 2
  heads: 4
  dropout: 0.0
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 16
  epochs: 60
  patience: 15
  pad_weight: 0.1
  stop_weight: 1.0
  tool_weight: 0.5
  separation_weight: 0.05
  nfe: 8
  stop_threshold: 0.5

agent_evaluation:
  max_steps: 12
  nfe: 8
  stop_threshold: 0.5
  runtime_embedding_policy: cache_or_encode
  prewarm_runtime_encoders: false
  perturbations:
    - name: one_empty_annotation_result
      task_id: synth-test-001
      tool_id: annotate_variant
      kind: empty_result
      once: true
      message: The pinned annotation snapshot returned an empty result; retry or replan.
