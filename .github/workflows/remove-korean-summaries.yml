name: Remove Korean summary sections
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-korean-summaries.yml]
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'heoneyzi/Medical'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply the reviewed Markdown-only edits
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, subprocess
          import re
          LABEL=re.compile(r'한국어\s*요약|국문\s*요약|korean\s*summary',re.I)
          DETAILS=re.compile(r'<details\b[^>]*>.*?</details>',re.I|re.S)
          HEAD=re.compile(r'^(#{1,6})[ \t]+(.+?)[ \t]*$',re.M)
          def clean(text):
              def drop(m):
                  summary=re.search(r'<summary\b[^>]*>(.*?)</summary>',m.group(),re.I|re.S)
                  return '' if summary and LABEL.search(summary.group(1)) else m.group()
              new=DETAILS.sub(drop,text)
              headings=list(HEAD.finditer(new));remove=[]
              for i,h in enumerate(headings):
                  if not LABEL.search(h.group(2)):continue
                  end=next((x.start() for x in headings[i+1:] if len(x.group(1))<=len(h.group(1))),len(new))
                  remove.append((h.start(),end))
              for a,b in reversed(remove):new=new[:a]+new[b:]
              if new!=text:new=re.sub(r'\n{3,}','\n\n',new)
              return new

          expected={'Bu-net/README.md': {'before': '92bb4cf0fb40a853f001f904f4831d3bd79d54e3c93c111f870aa3ee5f43d788', 'after': 'f8e4a2c9bb665c61dd5e8a75febd06940e89db238677273bc54bcd21e3a5f71b'}, 'Bu-net/code/reinforcing_material/ORIGINAL_README.md': {'before': 'a86a38931091e2a2a1f1dc88217a9b896874da32c83e6c8d984d922d48ccfa43', 'after': 'eb750c0eeaabaec2856a182588e4274a7f449256869ef42042187aa0670d480f'}, 'CAFA6/README.md': {'before': 'b9676626abcc68e163e0ba35b3392a592cb67c8327ce1b336eb01c938062fc05', 'after': '067e680e0b9f108997998877b0e1b551815c7d9745ba67de6b23cad876db6402'}, 'GDTR/README.md': {'before': '9059dccecd7787f1ba72a28730ccde953592c03f40c41adef180a5debd2cf115', 'after': '0f0ae4d0e7b02ca68bb0b3a1b4ebb32638c9737a2d28fe5f4a3ed44fc4c73eb6'}, 'GDTR/gdtr-poc/README.md': {'before': '588e396e95581ce2f3fc387f893085b5c37b462f3198c8cb0f171e52af426c2e', 'after': 'a6ee06f4d424c8812a37533cfae521f1020a23579f3eebd39ec56ee295d47906'}, 'GDTR/gdtr-poc/experiments/E0_phase0_hyenadna/README.md': {'before': '6e6cc5a9d77ca503caa8e024faad0ca998f195801fd4e2e970a5286392fc51ab', 'after': '0bf98ea84fc31a95e68413d4c00919c051a81d5a954a01315638474dea8c2abd'}, 'GDTR/gdtr-poc/experiments/E10_v8_revision/README.md': {'before': 'db70b49fbeef81c7df940861537b0687452c7491b241b3f12dacb0aa3aedd257', 'after': 'f57132bbbc7c5dbcc8664183be450cb3e9990149424e17fc36b86f0279726839'}, 'GDTR/gdtr-poc/experiments/E1_phase1_evo2_calibration/README.md': {'before': '2109724089c28a821eafa5c97591ba2dbae84c426a21fa363ef5ee01444e512c', 'after': '2290603599eb8aa6c26070949c10a62bc1695e3dc6591b138cebe349d5a7f76f'}, 'GDTR/gdtr-poc/experiments/E2_phase2_chr17_replication/README.md': {'before': '0ece7e76e3b1d8fba3eb5099be71d4e194e4e2ed7dd3d367cd2ad36e5f5a1001', 'after': '755a658f56d8775b726b7b18a5924e21ce12a1b9dc43270538fe2566d8631930'}, 'GDTR/gdtr-poc/experiments/E3_phase3_clinvar/README.md': {'before': '13c0bd285efd7a89fdb40776288bdf1aa782d42e4270467eaa203ebf6cb2ae3f', 'after': '8b2d9c53e4b2695337cb61bbdd481b9bdf09